# ClevoControl – lets the group "clevocontrol" switch CPU turbo and the CPU limit ("cooling modes").
# Installed to /etc/tmpfiles.d/clevocontrol.conf by contrib/linux/install.sh; applied at every boot.
# Intel (intel_pstate):
z /sys/devices/system/cpu/intel_pstate/no_turbo     0664 root clevocontrol -
z /sys/devices/system/cpu/intel_pstate/max_perf_pct 0664 root clevocontrol -
# AMD and other cpufreq drivers:
z /sys/devices/system/cpu/cpufreq/boost             0664 root clevocontrol -
