name: Feature request
description: Suggest an idea
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like ClevoControl to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why? What would you use it for?
  - type: input
    id: model
    attributes:
      label: Laptop model and OS (if it matters)
